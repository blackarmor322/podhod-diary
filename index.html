<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141614">
  <meta name="description" content="Личный дневник силовых тренировок">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
  <title>Подход — дневник тренировок</title>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="wordmark"><img src="./icon-192.png" width="34" height="34" alt="">Подход</div>
      <span id="storage-state" class="sync-state" role="status">На этом устройстве</span>
    </header>
    <main>
      <section id="record-page" aria-labelledby="record-title">
        <h1 id="record-title">Запись</h1>
        <form id="record-form" novalidate>
          <div class="surface exercise-card">
            <label class="row"><span>Группа</span><select id="group" required aria-label="Группа мышц"></select></label>
            <label class="row"><span>Упражнение</span><select id="exercise" required aria-label="Упражнение"></select></label>
            <label id="name-row" class="row" hidden><span>Название</span><input id="exercise-name" maxlength="70" placeholder="Введи название" autocomplete="off"></label>
          </div>
          <p id="reference" class="reference" hidden></p>
          <div class="fields">
            <label class="metric"><span>Вес, кг</span><input id="weight" inputmode="decimal" autocomplete="off" maxlength="7" placeholder="—"></label>
            <label class="metric"><span>Подходы</span><input id="sets" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="—" required></label>
            <label class="metric"><span>Повторов всего</span><input id="reps" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="—" required></label>
          </div>
          <label class="row surface date-row"><span>Дата</span><input id="date" type="date" min="1900-01-01" max="9999-12-31" required></label>
          <p id="form-error" class="error" role="alert" hidden></p>
          <button type="button" id="cancel-edit" class="secondary" hidden>Отменить редактирование</button>
          <div class="save-dock"><button id="save" class="primary" type="submit" disabled>Сохранить запись</button></div>
        </form>
        <p id="notice" class="notice" role="status"></p>
      </section>

      <section id="progress-page" aria-labelledby="progress-title" hidden>
        <h1 id="progress-title">Прогресс</h1>
        <div class="surface exercise-card">
          <label class="row"><span>Группа</span><select id="progress-group" aria-label="Группа мышц"></select></label>
          <label class="row"><span>Упражнение</span><select id="progress-exercise" aria-label="Упражнение"></select></label>
        </div>
        <div id="progress-summary" class="surface result-card" hidden>
          <div id="chart-caption" class="caption"></div>
          <div id="chart-metric" class="chart-metric"></div>
          <canvas id="chart" height="238" role="img" aria-label="График результатов по датам"></canvas>
          <label id="point-row" class="row point-row" hidden><span>Дата на графике</span><select id="chart-point" aria-label="Дата на графике"></select></label>
          <p id="chart-details" class="chart-details"></p>
        </div>
        <p id="progress-empty" class="empty"></p>
      </section>

      <section id="journal-page" aria-labelledby="journal-title" hidden>
        <h1 id="journal-title">Журнал</h1>
        <p id="journal-empty" class="empty" hidden>Здесь появятся сохранённые записи. Добавь первый результат во вкладке «Запись».</p>
        <div id="journal-list"></div>
        <details class="backup">
          <summary>Перенос данных</summary>
          <div class="backup-actions">
            <button class="secondary" id="export" type="button">Скачать файл</button>
            <button class="secondary" id="import" type="button">Загрузить файл</button>
          </div>
          <input type="file" id="import-file" accept=".json,application/json" hidden>
          <p class="backup-message" id="backup-message" role="status"></p>
        </details>
      </section>
    </main>

    <nav class="tabbar" aria-label="Разделы дневника">
      <button type="button" class="tab" data-page="record" aria-current="page"><span class="symbol record-symbol" aria-hidden="true"></span>Запись</button>
      <button type="button" class="tab" data-page="progress"><span class="symbol progress-symbol" aria-hidden="true"></span>Прогресс</button>
      <button type="button" class="tab" data-page="journal"><span class="symbol journal-symbol" aria-hidden="true"></span>Журнал</button>
    </nav>
  </div>
</body>
</html>
